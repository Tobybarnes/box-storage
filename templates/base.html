<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="{% block viewport %}width=device-width, initial-scale=1.0{% endblock %}">
    <meta name="theme-color" content="#f7f8fa">
    <title>{% block title %}Box Storage{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico', v=2) }}" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon-32.png', v=2) }}" sizes="32x32">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='box-storage.svg', v=2) }}" sizes="any">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png', v=2) }}" sizes="180x180">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% block site_header %}
    <header class="site-header no-print">
        <a class="wordmark" href="{{ url_for('index') }}" aria-label="Box Storage, all boxes">
            <img class="brand-mark" width="28" height="28" src="{{ url_for('static', filename='box-storage.svg', v=2) }}" alt="">
            <span>Box Storage</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
            <a class="button button-quiet" href="{{ url_for('labels') }}">Print labels</a>
            <a class="button button-primary" href="{{ url_for('new_box') }}"><span aria-hidden="true">+</span> New box</a>
        </nav>
    </header>
    {% endblock %}
    <main id="main-content" class="main-content {% block main_class %}{% endblock %}" tabindex="-1">
        {% block content %}{% endblock %}
    </main>
    {% block site_footer %}
    <footer class="site-footer no-print">
        <span>Moss Music Software</span>
        <span>v{{ version }}</span>
    </footer>
    {% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
